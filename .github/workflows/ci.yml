name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cheapest first: lint gates the tests, the tests gate the benchmarks.
jobs:
  # A pull request that touches no Go code skips every job below. Skipped jobs
  # count as passing for required checks, so such a PR still merges.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo go=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" |
            grep -qE '(\.go|(^|/)go\.(mod|sum|work|work\.sum)|^\.github/workflows/.*|^justfile|^\.golangci\.ya?ml)$'; then
            echo go=true >> "$GITHUB_OUTPUT"
          else
            echo go=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # vet, build, gofmt, go fix, and the benchmarks module, which ./... misses.
      - run: just lint
      - run: just actionlint

  analyze:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # modernize and betteralign compile from source, so they run beside lint.
      - run: just analyze

  golangci:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # The recipe compiles the pinned linter with the Go of this job. The action
      # ships a binary built with an older Go, which refuses this module.
      - run: just golangci

  test:
    needs: [changes, lint]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - run: just test
      - run: just cross

  vuln:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - run: just vuln

  bench:
    needs: [changes, test]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # The numbers from a shared runner mean nothing; this proves they still run.
      - run: just bench-ci
