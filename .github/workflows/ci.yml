name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cheapest first: lint gates the tests, the tests gate the benchmarks.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # vet, build, gofmt, go fix, and the benchmarks module, which ./... misses.
      - run: just lint
      - run: just actionlint

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # modernize and betteralign compile from source, so they run beside lint.
      - run: just analyze

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # The recipe compiles the pinned linter with the Go of this job. The action
      # ships a binary built with an older Go, which refuses this module.
      - run: just golangci

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - run: just test
      - run: just cover
      - run: just fuzz-smoke
      - run: just cross

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - run: just vuln

  bench:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.mod
            benchmarks/go.sum
            _examples/chat/go.mod
            _examples/restapi/go.mod
            _examples/tenants/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # The numbers from a shared runner mean nothing; this proves they still run.
      - run: just bench-ci
