name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".claude/**"

permissions:
  contents: read

# Cheapest first: lint gates the tests, the tests gate the benchmarks.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      # vet, build, gofmt, go fix, and the benchmarks module, which ./... misses.
      - run: just lint

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      # modernize and betteralign compile from source, so they run beside lint.
      - run: just analyze

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      # The recipe compiles the pinned linter with the Go of this job. The action
      # ships a binary built with an older Go, which refuses this module.
      - run: just golangci

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      - run: just test

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      - run: just vuln

  bench:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      # The numbers from a shared runner mean nothing; this proves they still run.
      - run: just bench-ci
