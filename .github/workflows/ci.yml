name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".gitignore"
      - ".claude/**"

permissions:
  contents: read

# Ordered cheapest first: lint gates the tests, the tests gate the benchmarks,
# so a failure skips the stages behind it.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      # go vet, go build, gofmt, the go fix modernizers, and a vet of the
      # benchmarks module, which is its own module and so invisible to ./...
      - run: just lint

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      # modernize and betteralign, which compile from source; they run beside
      # lint rather than after it so the slow build overlaps the fast checks.
      - run: just analyze

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      # The recipe compiles the pinned linter with the Go of this job, which is
      # what a go 1.27 module needs: a prebuilt golangci-lint binary carries the
      # Go it was built with, and refuses a module that targets a later one.
      # It still runs through go run tool@version, so the linter never enters
      # the module graph of anyone who imports this router.
      - run: just golangci

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      - run: just test

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      - run: just vuln

  bench:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: extractions/setup-just@v3
      # A short run: the numbers from a shared runner mean nothing, but a
      # benchmark that stops compiling has to fail the build.
      - run: just bench-ci
