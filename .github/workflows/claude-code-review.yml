name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

jobs:
  claude-review:
    # Only auto-review non-draft PRs authored by the repo owner.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            This is a zero-dependency HTTP router library for Go 1.27. Focus on:
            1. Correctness of route matching, and whether new patterns are covered by tests
            2. Allocations on the request path; the router budgets one per request,
               and zero when NewPooled is used
            3. Anything that would leak one request's data into the next through a
               pooled context
            4. Go idioms and the conventions the README documents
            5. New dependencies in go.mod, which the library does not accept

            Use inline comments for specific issues. Use a top-level comment for
            general observations.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
