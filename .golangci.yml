# golangci-lint v2.13.1 crashes on this module with
#
#	goanalysis_metalinter: SA4023: package "routertest_test": runtime error:
#	index out of range [1] with length 1
#
# The crash comes from the analyzer, not from the code: adding any method to
# routertest.Response is enough to trigger it, and that type also carries the
# generic method JSON[T]. No release past v2.13.1 fixes it yet, so SA4023 stays
# off until one does. Every other staticcheck check keeps its default state.
version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        - -SA4023
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
