version: "2"

linters:
  enable:
    - gosec
    - bodyclose
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      # G101 matches the word "token" in a constant name. These constants name a
      # context key and an HTTP header, not a secret.
      - linters: [gosec]
        path: ^(middleware/csrf\.go|mime\.go)$
        text: "G101"
      # G115 flags integer conversions whose range the code already bounds: a
      # slice length or a shard count that min() caps, a rune below utf8.RuneSelf,
      # and the length of a cookie name written into a fixed-width MAC header.
      - linters: [gosec]
        path: ^(compile\.go|host\.go|cookie/cookie\.go|htmx/htmx\.go|middleware/ratelimit\.go)$
        text: "G115"
      # G124 wants Secure, HttpOnly and SameSite on every cookie. NewCookie is the
      # builder that the caller then tunes, the cookie package and the CSRF middleware
      # set the attributes from their options, and the routertest cookies replay a
      # value into a request, where those attributes do not travel.
      - linters: [gosec]
        path: ^(cookie\.go|cookie/.*\.go|middleware/csrf\.go|routertest/routertest\.go)$
        text: "G124"
      # routertest writes golden files under testdata with the usual 0755 mode.
      - linters: [gosec]
        path: ^routertest/routertest\.go$
        text: "G301"
      # Tests: they write plain-text bodies to a recorder (G705), build files in
      # t.TempDir or testdata (G301, G304, G306), call httptest servers by URL
      # (G107), use a seeded PRNG for reproducible fuzz rounds (G404), pin a TLS
      # version on purpose (G402), convert small test integers (G115), use cookies
      # without flags (G124), hold fixture tokens (G101) and index slices after a
      # length check (G602). Tests also drop the error of a Close, a Write or an
      # Execute on a recorder or a file they own (G104).
      - linters: [gosec]
        path: _test\.go$
        text: "G(101|104|107|115|124|301|304|306|402|404|602|705)"
      # postChunked closes the response body in a t.Cleanup, which bodyclose does not
      # see across the helper boundary.
      - linters: [bodyclose]
        path: ^middleware/bodylimit_test\.go$
