# -SA4023 works around a crash in golangci-lint v2.13.1, not a finding: the
# analyzer panics on a generic function with two type parameters, which
# router.SSEComponent is. The rest of the list repeats the staticcheck checks
# that golangci-lint excludes by default.
#
# TODO: drop -SA4023 on the next golangci bump in the justfile and rerun.
version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        - -SA4023
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
