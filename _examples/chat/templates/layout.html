{{define "head" -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}} · go-router chat</title>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/htmx.min.js" integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/ext/hx-sse.min.js" integrity="sha384-VZD0TLKqhJ26ayBUgQg3ud6DsOLMJvtcz0ANpNc9WSbgIuQTnlXI2IfsF5jhBjT6" crossorigin="anonymous"></script>
<style>
	:root {
		color-scheme: light dark;
		--bg: light-dark(#f6f7f9, #14161a);
		--card: light-dark(#ffffff, #1d2026);
		--line: light-dark(#e2e5ea, #2b303a);
		--text: light-dark(#171a1f, #e7e9ee);
		--muted: light-dark(#6b7280, #98a0ae);
		--own: light-dark(#dbeafe, #24406b);
		--radius: 12px;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--bg);
		color: var(--text);
		font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	h1 { font-size: 1.25rem; margin: 0; }
	a { color: inherit; }
	input, button {
		font: inherit;
		border: 1px solid var(--line);
		border-radius: var(--radius);
		padding: .6rem .8rem;
		background: var(--card);
		color: inherit;
	}
	button { background: var(--text); color: var(--card); border-color: transparent; cursor: pointer; }
	.error { color: #d33; margin: 0; font-size: .9rem; }
	.muted { color: var(--muted); font-size: .9rem; margin: 0; }

	/* the first page */
	.centered { display: grid; place-items: center; min-height: 100dvh; padding: 1rem; }
	.card {
		background: var(--card);
		border: 1px solid var(--line);
		border-radius: var(--radius);
		padding: 1.5rem;
		width: min(28rem, 100%);
		display: grid;
		gap: .75rem;
	}
	.card form { display: grid; gap: .75rem; }

	/* the room */
	.chat { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; }
	.chat > header, .chat > form {
		display: flex;
		gap: .75rem;
		align-items: center;
		padding: .75rem 1rem;
		background: var(--card);
		border-color: var(--line);
		border-style: solid;
		border-width: 0;
	}
	.chat > header { border-bottom-width: 1px; justify-content: space-between; }
	.chat > form { border-top-width: 1px; }
	.chat > form input { flex: 1; }
	.identity, .leave { display: flex; gap: .5rem; align-items: center; margin: 0; }
	.leave button { padding: .35rem .65rem; }
	#log { overflow-y: auto; padding: 1rem; display: grid; gap: .5rem; align-content: start; }
	.msg {
		background: var(--card);
		border: 1px solid var(--line);
		border-radius: var(--radius);
		padding: .5rem .75rem;
		max-width: min(40rem, 85%);
		display: grid;
		gap: .15rem;
	}
	.msg.own { background: var(--own); justify-self: end; }
	.msg .who { font-weight: 600; font-size: .85rem; }
	.msg time { color: var(--muted); font-size: .75rem; }
	.notice { text-align: center; color: var(--muted); font-size: .85rem; margin: 0; }
</style>
{{- end}}

{{define "index" -}}
<!doctype html>
<html lang="en">
<head>{{template "head" "Join"}}</head>
<body class="centered">
	<main class="card">
		<h1>go-router chat</h1>
		<p class="muted">Pick a name. Everyone in the room sees you arrive.</p>
		{{template "join" .}}
	</main>
</body>
</html>
{{- end}}

{{define "chat" -}}
<!doctype html>
<html lang="en">
<head>{{template "head" "Chat"}}</head>
<body class="chat">
	<header>
		<h1>go-router chat</h1>
		<div class="identity">
			<p class="muted">You are <strong>{{.Name}}</strong></p>
			<form class="leave" action="/leave" method="post" hx-post="/leave" hx-status:4xx="swap:none" hx-status:5xx="swap:none">
				<input type="hidden" name="_csrf" value="{{.CSRFToken}}">
				<button type="submit">Leave</button>
			</form>
		</div>
	</header>

	<!--
		The stream carries rendered HTML in unnamed events, which hx-sse swaps
		into the element that connects; a named event would only fire a DOM
		event. hx-swap appends each one to the log.
	-->
	<div id="log" role="log" aria-live="polite"
		hx-sse:connect="/room/events" hx-swap="beforeend"
		hx-on::sse:after:message="this.scrollTop = this.scrollHeight"></div>

	<!--
		The post answers 204, so htmx swaps nothing: the message arrives over
		the stream instead, like everybody else's. The answer also fires
		message-sent, which empties the input. htmx 4 swaps an error answer
		too, so hx-status keeps a 4xx or 5xx from replacing the form.
	-->
	<form action="/room/messages" method="post" hx-post="/room/messages" hx-status:4xx="swap:none" hx-status:5xx="swap:none" hx-on:message-sent="this.reset()" autocomplete="off">
		<input type="hidden" name="_csrf" value="{{.CSRFToken}}">
		<input name="text" placeholder="Write a message" maxlength="500" required autofocus>
		<button type="submit">Send</button>
	</form>
</body>
</html>
{{- end}}
